name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pipeline_warehouse
          POSTGRES_USER: pipeline_user
          POSTGRES_PASSWORD: pipeline_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: pipeline_warehouse
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter (flake8)
        run: |
          pip install flake8
          flake8 src/ api/ --max-line-length=120 --ignore=E501,W503 --count --show-source --statistics
        continue-on-error: true

      - name: Initialize database schemas
        run: python scripts/setup_database.py

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short

      - name: Run full test suite with coverage
        run: |
          pip install pytest-cov
          python -m pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
